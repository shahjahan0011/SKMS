version: '3.8'

services:
  backend:
    image: jshah04/skms-backend:v1
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true

  frontend:
    image: jshah04/skms-frontend:v1
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    stdin_open: true
    tty: true
    depends_on:
      - backend